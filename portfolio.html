<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosie Choi - TCSS 490 TCG Portfolio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-white overflow-hidden m-0 p-0">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // Custom inline SVG icons to prevent any external CDN namespace failures
        const IconUser = ({ size = 24, className = "" }) => (
          <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        );

        const IconBriefcase = ({ size = 24, className = "" }) => (
          <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
          </svg>
        );

        const IconCode = ({ size = 24, className = "" }) => (
          <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <polyline points="16 18 22 12 16 6"></polyline>
            <polyline points="8 6 2 12 8 18"></polyline>
          </svg>
        );

        const IconBrain = ({ size = 24, className = "" }) => (
          <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 3.44-3.04Z"></path>
            <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-3.44-3.04Z"></path>
          </svg>
        );

        const IconActivity = ({ size = 24, className = "" }) => (
          <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
        );

        const IconBook = ({ size = 24, className = "" }) => (
          <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
        );

        const IconSparkles = ({ size = 24, className = "" }) => (
          <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <path d="m12 3-1.9 5.8a2 2 0 0 1-1.2 1.2L3 12l5.9 1.9a2 2 0 0 1 1.2 1.2L12 21l1.9-5.8a2 2 0 0 1 1.2-1.2L21 12l-5.9-1.9a2 2 0 0 1-1.2-1.2Z"></path>
          </svg>
        );

        const COMMANDER_CARD = {
          id: 1,
          title: "Rosie Choi",
          actualName: "Jodah, the Unifier",
          type: "Legendary Creature — Human Wizard",
          cost: "W U B R G",
          rarity: "Mythic",
          icon: IconUser,
          color: "from-blue-900 via-purple-800 to-amber-600",
          borderColor: "border-[#D4AF37]",
          manaColor: "bg-gradient-to-br from-amber-200 via-purple-300 to-red-300 text-slate-900",
          stats: "5/5",
          flavor: "Undergraduate CS student at UW Tacoma (B.S. Computer Science, expected Spring 2027). Passionate about software architecture and database management.",
          effect: "Legendary creatures you control get +X/+X, where X is the number of legendary creatures you control.\n\nWhenever you cast a legendary spell from your hand, exile cards from the top of your library until you exile a legendary nonland card with lesser mana value. You may cast that card without paying its mana cost."
        };

        const CARDS = [
          {
            id: 2,
            title: "The Resume",
            type: "Artifact — Equipment",
            cost: "3",
            rarity: "Rare",
            icon: IconBriefcase,
            color: "from-slate-700 to-slate-400",
            borderColor: "border-[#c0c0c0]",
            manaColor: "bg-slate-300 text-slate-800",
            stats: "",
            flavor: "Experience: Implementation Consultant Intern at FAST Enterprises (C#, PostgreSQL), Data Analyst at Amazon. Projects: Aether Log Core, HuskyMap LLM.",
            effect: "Equipped creature gets +5 to technical interviews and gains advantage on architecture rolls.\n\nEquip {2}"
          },
          {
            id: 3,
            title: "Portfolio Site",
            type: "Sorcery",
            cost: "1 U R",
            rarity: "Uncommon",
            icon: IconCode,
            color: "from-red-800 to-blue-800",
            borderColor: "border-[#718096]",
            manaColor: "bg-gradient-to-br from-blue-500 to-red-500 text-white",
            stats: "",
            flavor: "Artifact 1. An interactive, TCG-style React portfolio built to showcase quarter projects.",
            effect: "Draw a card. Reveal your hand to the opponent. They must acknowledge your superior UI/UX design skills."
          },
          {
            id: 4,
            title: "EV Optimizer",
            type: "Artifact — Vehicle",
            cost: "4",
            rarity: "Common",
            icon: IconActivity,
            color: "from-stone-500 to-stone-700",
            borderColor: "border-[#000000]",
            manaColor: "bg-stone-400 text-slate-800",
            stats: "4/4",
            flavor: "Artifact 2. A web tool to calculate real-world battery range and optimize charging schedules for an AWD electric vehicle.",
            effect: "Crew 2 (Tap any number of creatures you control with total power 2 or more: This Vehicle becomes an artifact creature until end of turn.)"
          },
          {
            id: 5,
            title: "Board State Analyzer",
            type: "Enchantment",
            cost: "2 W U B R G", 
            rarity: "Mythic",
            icon: IconBrain,
            color: "from-purple-900 to-indigo-600",
            borderColor: "border-[#D4AF37]",
            manaColor: "bg-gradient-to-r from-amber-200 via-purple-300 to-red-300 text-slate-900",
            stats: "",
            flavor: "Artifact 3. An AI-powered tool for Magic: The Gathering that evaluates complex board states and suggests optimal plays or infinite combo lines.",
            effect: "At the beginning of your upkeep, analyze the board. You may scry 3, then draw a card."
          },
          {
            id: 6,
            title: "Document Organizer",
            type: "Artifact",
            cost: "2 W",
            rarity: "Uncommon",
            icon: IconBook,
            color: "from-amber-100 to-white",
            borderColor: "border-[#718096]",
            manaColor: "bg-amber-100 text-slate-800",
            stats: "",
            flavor: "Artifact 4. A streamlined, highly accessible web interface to help elderly family members track and organize tax forms and wire transfer receipts.",
            effect: "T: Add one mana of any color. Spend this mana only to cast accessibility spells."
          },
          {
            id: 7,
            title: "K-Beauty Matcher",
            type: "Legendary Artifact",
            cost: "3 G",
            rarity: "Rare",
            icon: IconSparkles,
            color: "from-green-600 to-emerald-900",
            borderColor: "border-[#c0c0c0]",
            manaColor: "bg-green-200 text-green-900",
            stats: "",
            flavor: "Artifact 5. A computer vision tool that analyzes skin undertones to recommend accurate base foundation matches across brands.",
            effect: "Whenever a creature enters the battlefield under your control, put a +1/+1 counter on it and it gains hexproof until end of turn."
          }
        ];

        const CardFace = ({ card }) => {
          const IconComp = card.icon;
          return (
            <div className={`relative h-full w-full rounded-[8px] border-[3px] md:border-[4px] ${card.borderColor} overflow-hidden bg-gradient-to-br ${card.color} flex flex-col pointer-events-none`}>
              <div className="mx-1 mt-1 bg-[#c9d8c9] border border-black/50 rounded shadow-sm px-1 py-0.5 flex justify-between items-center relative z-10">
                <div className="text-[6px] sm:text-[8px] md:text-[10px] font-bold text-black truncate pr-1">
                  {card.title}
                </div>
                <div className={`text-[6px] sm:text-[8px] font-bold px-1 rounded-full border border-black/25 shadow-inner ${card.manaColor}`}>
                  {card.cost}
                </div>
              </div>
              
              <div className="mx-1 mt-1 flex-1 bg-slate-800 border-2 border-black/80 shadow-[inset_0_0_10px_rgba(0,0,0,0.8)] flex items-center justify-center relative overflow-hidden">
                 <IconComp className="text-white/60 drop-shadow-md z-10 w-4 h-4 sm:w-6 sm:h-6 md:w-8 md:h-8" />
              </div>

              <div className="mx-1 mt-1 bg-[#c9d8c9] border border-black/50 rounded shadow-sm px-1 flex items-center relative z-10">
                 <span className="text-[5px] sm:text-[7px] md:text-[8px] font-bold text-black truncate">{card.type}</span>
              </div>

              <div className="mx-1 my-1 flex-1 bg-[#f0f0f0]/90 border border-black/50 rounded p-1 shadow-inner relative z-10 opacity-70"></div>
            </div>
          );
        };

        const BoardCard = ({ card, x, y, isDragging, onPointerDown, onMouseEnter, onMouseLeave }) => {
          return (
            <div
              onPointerDown={(e) => onPointerDown(e, card.id, card.id === COMMANDER_CARD.id ? 'commander' : 'board')}
              onMouseEnter={onMouseEnter}
              onMouseLeave={onMouseLeave}
              style={{ left: x, top: y, opacity: isDragging ? 0.3 : 1, position: 'absolute' }}
              className="w-20 sm:w-28 md:w-36 aspect-[2.5/3.5] rounded-xl bg-black p-1 shadow-xl cursor-grab active:cursor-grabbing hover:scale-105 transition-transform origin-center z-20"
            >
              <CardFace card={card} />
              {!isDragging && (
                <div className="absolute -inset-2 border-2 border-transparent hover:border-[#D4AF37]/50 rounded-[14px] pointer-events-none transition-colors" />
              )}
            </div>
          );
        };

        const CommandZoneCard = ({ card, isDragging, onPointerDown, onMouseEnter, onMouseLeave }) => {
          return (
            <div
              onPointerDown={(e) => onPointerDown(e, card.id, 'commander')}
              onMouseEnter={onMouseEnter}
              onMouseLeave={onMouseLeave}
              style={{ opacity: isDragging ? 0.3 : 1 }}
              className="relative w-20 sm:w-24 md:w-28 aspect-[2.5/3.5] rounded-xl bg-black p-1 shadow-lg cursor-grab active:cursor-grabbing flex-shrink-0 border-2 border-stone-700 hover:border-amber-400 transition-all z-10"
            >
              <CardFace card={card} />
            </div>
          );
        };

        const HandCard = ({ card, index, total, isDragging, onPointerDown, onMouseEnter, onMouseLeave }) => {
          const cardRef = useRef(null);
          const [tilt, setTilt] = useState({ x: 0, y: 0 });
          const [isDrawn, setIsDrawn] = useState(false);

          useEffect(() => {
            const timer = setTimeout(() => {
              setIsDrawn(true);
            }, 400 + (index * 150));
            return () => clearTimeout(timer);
          }, [index]);

          const handleMouseMove = (e) => {
            if (!cardRef.current || isDragging) return;
            const rect = cardRef.current.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            const multiplier = 20; 
            setTilt({
              x: (y / (rect.height / 2)) * -multiplier,
              y: (x / (rect.width / 2)) * multiplier
            });
          };

          const handleMouseLeaveInner = () => {
            setTilt({ x: 0, y: 0 });
            onMouseLeave();
          };

          const centerIndex = (total - 1) / 2;
          const diff = index - centerIndex;
          const rotation = diff * 4; 
          const yOffset = Math.abs(diff) * Math.abs(diff) * 2; 
          const xOffsetCSS = `calc(${diff} * clamp(50px, 8vw, 100px))`; 

          let style = {};

          if (!isDrawn) {
            style = {
              transform: `translate(calc(45vw - 40px), -60vh) rotate(0deg) scale(0.3)`,
              zIndex: index,
              opacity: 0,
              pointerEvents: 'none'
            };
          } else if (tilt.x !== 0 || tilt.y !== 0) {
            style = {
              transform: `translate(${xOffsetCSS}, -120px) rotate(0deg) scale(1.6) perspective(1000px) rotateX(${tilt.x}deg) rotateY(${tilt.y}deg)`,
              zIndex: 50,
              transition: 'transform 0.1s ease-out',
              opacity: isDragging ? 0 : 1
            };
          } else {
            style = {
              transform: `translate(${xOffsetCSS}, ${yOffset}px) rotate(${rotation}deg)`,
              zIndex: index,
              opacity: isDragging ? 0.3 : 1
            };
          }

          return (
            <div
              ref={cardRef}
              onPointerDown={(e) => onPointerDown(e, card.id, 'hand')}
              onMouseEnter={onMouseEnter}
              onMouseLeave={handleMouseLeaveInner}
              onMouseMove={handleMouseMove}
              style={style}
              className="absolute bottom-0 w-20 sm:w-28 md:w-36 aspect-[2.5/3.5] rounded-xl bg-black p-1 shadow-2xl cursor-grab active:cursor-grabbing origin-bottom transition-all duration-300 ease-out preserve-3d"
            >
              <CardFace card={card} />
            </div>
          );
        };

        const MTGCardPreview = ({ card }) => {
          const IconComp = card.icon;
          return (
            <div className="w-full max-w-[200px] sm:max-w-[240px] md:max-w-[320px] lg:max-w-[380px] flex-shrink-0 perspective-[1000px] group mx-auto">
              <div className="relative w-full aspect-[2.5/3.5] rounded-[20px] bg-black p-2 shadow-[0_20px_50px_rgba(0,0,0,0.9)] transform transition-transform duration-500">
                <div className={`relative h-full w-full bg-gradient-to-br ${card.color} rounded-[12px] border-4 ${card.borderColor} flex flex-col overflow-hidden`}>
                  <div className="absolute inset-0 opacity-20 mix-blend-multiply" 
                       style={{ backgroundImage: `url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E")` }} />

                  <div className="mx-2 mt-2 bg-gradient-to-b from-[#e3e8e3] to-[#c9d8c9] border-2 border-black/60 rounded-[4px] px-2 py-1 flex justify-between items-center shadow-md relative z-10">
                    <h2 className="text-sm md:text-base font-bold text-black drop-shadow-[0_1px_1px_rgba(255,255,255,0.8)]">{card.title}</h2>
                    <div className={`rounded-full px-2 py-0.5 text-xs font-sans font-bold shadow-inner border border-black/30 ${card.manaColor}`}>
                      {card.cost}
                    </div>
                  </div>

                  {card.actualName && (
                     <div className="mx-2 px-1 text-[9px] font-sans font-bold text-white/90 drop-shadow-md text-center">
                       "{card.actualName}"
                     </div>
                  )}

                  <div className={`mx-2 flex-1 rounded-[4px] border-2 border-black/80 bg-stone-900 flex items-center justify-center shadow-[inset_0_0_20px_rgba(0,0,0,0.9)] relative overflow-hidden group-hover:shadow-[inset_0_0_30px_rgba(0,0,0,1)] transition-shadow ${card.actualName ? 'mt-1' : 'mt-2'}`}>
                    <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent pointer-events-none" />
                    <IconComp size={80} className="text-white drop-shadow-[0_0_25px_rgba(255,255,255,0.5)] z-10 transform transition-transform group-hover:scale-110 duration-700" />
                  </div>

                  <div className="mx-2 mt-2 bg-gradient-to-b from-[#e3e8e3] to-[#c9d8c9] border-2 border-black/60 rounded-[4px] px-2 py-1 flex justify-between items-center shadow-md relative z-10">
                    <span className="text-xs md:text-sm font-bold text-black drop-shadow-[0_1px_1px_rgba(255,255,255,0.8)]">{card.type}</span>
                    <div className={`w-4 h-4 rounded-full border border-black/50 flex items-center justify-center ${card.rarity === 'Mythic' ? 'bg-[#D4AF37]' : card.rarity === 'Rare' ? 'bg-[#c0c0c0]' : card.rarity === 'Uncommon' ? 'bg-[#718096]' : 'bg-black'}`}>
                       {card.actualName ? <StarShooting size={10} className="text-white" /> : <IconSparkles size={10} className="text-white" />}
                    </div>
                  </div>

                  <div className="mx-2 mt-2 mb-2 h-[38%] bg-[#f0f0f0]/95 border-2 border-black/60 rounded-[4px] p-3 text-black shadow-[inset_0_0_10px_rgba(0,0,0,0.1)] relative z-10 flex flex-col justify-between">
                    <div className="overflow-y-auto pr-1 text-[11px] md:text-[12px] leading-tight flex-1 font-serif">
                      <p className="mb-2 whitespace-pre-line">{card.effect}</p>
                      <p className="italic text-stone-700 mt-2 border-t border-black/20 pt-2 font-serif text-[10px] md:text-[11px] leading-tight">
                        {card.flavor}
                      </p>
                    </div>
                    {card.stats && (
                      <div className="absolute -bottom-1 -right-1 bg-gradient-to-b from-[#e3e8e3] to-[#c9d8c9] border-2 border-black/60 rounded-[4px] px-3 py-1 font-bold text-sm md:text-base text-black shadow-md">
                        {card.stats}
                      </div>
                    )}
                  </div>
                  
                  <div className="px-3 pb-1 text-[8px] font-sans text-white/80 font-bold flex justify-between relative z-10">
                     <span>{card.actualName ? '2839 SLD' : '143/280'} • TCSS490</span>
                     <span>™ & © 2026</span>
                  </div>
                </div>
              </div>
            </div>
          );
        };

        const StarShooting = ({ size, className }) => (
          <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" fill="currentColor" />
            <path d="M2 2l4 4" />
            <path d="M4 10l-2-2" />
          </svg>
        );

        function App() {
          const [handIds, setHandIds] = useState(CARDS.map(c => c.id));
          const [boardCards, setBoardCards] = useState([]);
          const [commanderState, setCommanderState] = useState({ inZone: true, x: 0, y: 0 });
          const [activeCardId, setActiveCardId] = useState(null);
          const [hoveredCardId, setHoveredCardId] = useState(null);
          const [dragging, setDragging] = useState(null);

          const handlePointerDown = (e, id, source) => {
            if (e.button !== 0) return;
            e.preventDefault();
            e.stopPropagation();
            const node = e.currentTarget;
            const offsetX = node.offsetWidth / 2;
            const offsetY = node.offsetHeight / 2;
            setDragging({
              id,
              source,
              offsetX,
              offsetY,
              x: e.clientX - offsetX,
              y: e.clientY - offsetY
            });
            setActiveCardId(id);
          };

          const handlePointerMove = (e) => {
            if (!dragging) return;
            setDragging(prev => ({
              ...prev,
              x: e.clientX - prev.offsetX,
              y: e.clientY - prev.offsetY
            }));
          };

          const handlePointerUp = (e) => {
            if (!dragging) return;
            const isBattlefield = e.clientY < window.innerHeight - 180;

            if (dragging.source === 'hand') {
              if (isBattlefield) {
                setHandIds(prev => prev.filter(i => i !== dragging.id));
                setBoardCards(prev => [...prev, { id: dragging.id, x: dragging.x, y: dragging.y }]);
              }
            } else if (dragging.source === 'board') {
              if (isBattlefield) {
                setBoardCards(prev => prev.map(c => c.id === dragging.id ? { ...c, x: dragging.x, y: dragging.y } : c));
              } else {
                setBoardCards(prev => prev.filter(c => c.id !== dragging.id));
                setHandIds(prev => [...prev, dragging.id]);
              }
            } else if (dragging.source === 'commander') {
              if (isBattlefield) {
                setCommanderState({ inZone: false, x: dragging.x, y: dragging.y });
              } else {
                setCommanderState({ inZone: true, x: 0, y: 0 });
              }
            }
            setDragging(null);
          };

          const handleBoardClick = () => {
            setActiveCardId(null);
          };

          const previewId = hoveredCardId || activeCardId;
          const previewCard = previewId === COMMANDER_CARD.id ? COMMANDER_CARD : CARDS.find(c => c.id === previewId);
          const draggedCardInfo = dragging?.id === COMMANDER_CARD.id ? COMMANDER_CARD : CARDS.find(c => c.id === dragging?.id);

          return (
            <div 
              className="h-screen w-full bg-gradient-to-b from-[#1a1c23] to-[#2a2d36] text-stone-200 overflow-hidden font-serif selection:bg-amber-500/30 flex flex-col relative"
              onPointerMove={handlePointerMove}
              onPointerUp={handlePointerUp}
              onPointerLeave={handlePointerUp}
              onClick={handleBoardClick}
            >
              <div className={`fixed left-4 md:left-8 top-1/2 -translate-y-1/2 z-[100] transition-all duration-300 pointer-events-none ${previewCard ? 'opacity-100 scale-100 translate-x-0' : 'opacity-0 scale-95 -translate-x-10'}`}>
                 {previewCard && <MTGCardPreview card={previewCard} />}
              </div>

              {dragging && draggedCardInfo && (
                <div className="fixed pointer-events-none z-[110] w-20 sm:w-28 md:w-36 aspect-[2.5/3.5] rounded-xl bg-black p-1 shadow-2xl" style={{ left: dragging.x, top: dragging.y }}>
                  <CardFace card={draggedCardInfo} />
                </div>
              )}

              <div className="relative z-30 w-full bg-black/40 border-b border-stone-800 p-2 flex justify-between items-center h-16 pointer-events-none">
                 <div className="flex items-center gap-4 h-full pointer-events-auto">
                   <div className="flex gap-2 items-center bg-black/60 px-3 py-1.5 rounded-full border border-stone-700 shadow-md">
                      <div className="w-3 h-3 rounded-full bg-yellow-100 shadow-[inset_0_0_4px_rgba(0,0,0,0.8)]"></div>
                      <div className="w-3 h-3 rounded-full bg-blue-500 shadow-[inset_0_0_4px_rgba(0,0,0,0.8)]"></div>
                      <div className="w-3 h-3 rounded-full bg-stone-800 border border-stone-500 shadow-[inset_0_0_4px_rgba(0,0,0,0.8)]"></div>
                      <div className="w-3 h-3 rounded-full bg-red-500 shadow-[inset_0_0_4px_rgba(0,0,0,0.8)]"></div>
                      <div className="w-3 h-3 rounded-full bg-green-600 shadow-[inset_0_0_4px_rgba(0,0,0,0.8)]"></div>
                   </div>
                 </div>
              </div>

              <div className="flex-1 relative z-10 w-full h-full">
                 <div className="absolute top-4 left-4 z-20 pointer-events-auto">
                    <div className="border-2 border-dashed border-[#D4AF37]/60 bg-black/40 backdrop-blur-sm rounded-xl p-3 flex flex-col items-center justify-center shadow-[inset_0_0_15px_rgba(212,175,55,0.1)] transition-colors hover:border-[#D4AF37]/90 min-w-[100px] sm:min-w-[120px] md:min-w-[140px] min-h-[160px] md:min-h-[200px]">
                       <div className="text-[9px] sm:text-[10px] uppercase tracking-[0.2em] text-[#D4AF37] font-bold mb-3 drop-shadow-md">Command Zone</div>
                       {commanderState.inZone ? (
                         <CommandZoneCard 
                           card={COMMANDER_CARD}
                           isDragging={dragging?.id === COMMANDER_CARD.id}
                           onPointerDown={handlePointerDown}
                           onMouseEnter={() => setHoveredCardId(COMMANDER_CARD.id)}
                           onMouseLeave={() => setHoveredCardId(null)}
                         />
                       ) : (
                         <div className="w-20 sm:w-24 md:w-28 aspect-[2.5/3.5] border-2 border-transparent border-dashed rounded-lg opacity-30 flex items-center justify-center pointer-events-none">
                            <IconUser className="text-[#D4AF37]/50 w-8 h-8" />
                         </div>
                       )}
                    </div>
                 </div>

                 {boardCards.map(bc => {
                    const cardData = CARDS.find(c => c.id === bc.id);
                    if (!cardData) return null;
                    return (
                      <BoardCard 
                        key={`board-${bc.id}`}
                        card={cardData}
                        x={bc.x}
                        y={bc.y}
                        isDragging={dragging?.id === bc.id}
                        onPointerDown={handlePointerDown}
                        onMouseEnter={() => setHoveredCardId(bc.id)}
                        onMouseLeave={() => setHoveredCardId(null)}
                      />
                    );
                 })}
                 
                 {!commanderState.inZone && (
                    <BoardCard 
                      card={COMMANDER_CARD}
                      x={commanderState.x}
                      y={commanderState.y}
                      isDragging={dragging?.id === COMMANDER_CARD.id}
                      onPointerDown={handlePointerDown}
                      onMouseEnter={() => setHoveredCardId(COMMANDER_CARD.id)}
                      onMouseLeave={() => setHoveredCardId(null)}
                    />
                 )}

                 <div className="absolute right-4 top-4 z-20 w-20 sm:w-28 md:w-36 aspect-[2.5/3.5] group pointer-events-auto cursor-pointer">
                    <div id="visual-deck" className="relative w-full h-full group-hover:-translate-y-1 transition-transform duration-300 ease-out origin-center">
                      {[0, 1, 2, 3, 4].map(i => (
                         <div key={i} className="absolute inset-0 bg-[#000000] rounded-[12px] shadow-[2px_2px_8px_rgba(0,0,0,0.8)] overflow-hidden" style={{ transform: `translate(${i * 1.5}px, -${i * 1.5}px)` }}>
                              <div className="absolute inset-[3px] md:inset-[4px] rounded-lg bg-[#3a2820] overflow-hidden">
                                <div className="absolute inset-0 opacity-40 mix-blend-multiply" style={{ backgroundImage: `url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.05' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E")` }} />
                                <div className="absolute inset-0 bg-gradient-to-br from-[#593c28] via-[#2f1f18] to-[#1c120e] opacity-60" />
                                <div className="absolute inset-[8%] md:inset-[10%] rounded-full border-2 md:border-[3px] border-[#9c6b41] bg-[#1a1210] shadow-[inset_0_0_15px_rgba(0,0,0,1)] flex flex-col items-center justify-center relative overflow-hidden">
                                   <div className="absolute inset-0 bg-gradient-to-b from-[#2a2438] via-[#1f1b2b] to-[#15121c]" />
                                   <div className="relative z-10 w-full text-center mt-2 md:mt-4">
                                     <span className="font-serif font-black text-[#3176b3] text-[10px] sm:text-[14px] md:text-[20px] tracking-widest drop-shadow-[0_1px_1px_rgba(0,0,0,1)]" style={{ WebkitTextStroke: '0.5px #111', letterSpacing: '0.1em', transform: 'scaleY(1.2)', display: 'inline-block' }}>MAGIC</span>
                                   </div>
                                   <div className="relative w-8 h-8 sm:w-12 sm:h-12 md:w-16 md:h-16 my-1 md:my-2 z-10 flex items-center justify-center">
                                     <div className="absolute top-[5%] left-1/2 -translate-x-1/2 w-[22%] h-[22%] rounded-full bg-gradient-to-br from-[#f8f6d8] to-[#c4c0a5]"></div>
                                     <div className="absolute top-[32%] right-[5%] w-[22%] h-[22%] rounded-full bg-gradient-to-br from-[#aae0fa] to-[#4581a6]"></div>
                                     <div className="absolute bottom-[10%] right-[15%] w-[22%] h-[22%] rounded-full bg-gradient-to-br from-[#807a78] to-[#262423]"></div>
                                     <div className="absolute bottom-[10%] left-[15%] w-[22%] h-[22%] rounded-full bg-gradient-to-br from-[#f9aa8f] to-[#c63a23]"></div>
                                     <div className="absolute top-[32%] left-[5%] w-[22%] h-[22%] rounded-full bg-gradient-to-br from-[#9bd3ae] to-[#31774c]"></div>
                                   </div>
                                   <div className="relative z-10 w-full text-center mb-2 md:mb-4">
                                     <span className="font-serif font-bold text-[#d19c36] text-[5px] sm:text-[7px] md:text-[9px] tracking-widest drop-shadow-[0_1px_1px_rgba(0,0,0,1)]">The Gathering</span>
                                   </div>
                                </div>
                                <div className="absolute bottom-1 md:bottom-2 left-0 w-full text-center">
                                   <span className="text-[5px] sm:text-[6px] md:text-[8px] font-sans text-stone-300/80 font-black tracking-[0.2em] uppercase">Deckmaster</span>
                                </div>
                              </div>
                         </div>
                      ))}
                    </div>
                    <div className="absolute -bottom-6 md:-bottom-8 left-1/2 -translate-x-1/2 bg-black/90 px-3 py-1 rounded border border-stone-700 text-[9px] md:text-[11px] text-stone-300 font-sans tracking-widest uppercase shadow-lg text-center whitespace-nowrap">
                      Library (84)
                    </div>
                 </div>
              </div>

              <div className="h-32 md:h-48 relative z-30 w-full border-t border-stone-800 bg-gradient-to-t from-black/80 to-transparent flex items-end justify-center pb-2 md:pb-6 pointer-events-none">
                <div className="absolute left-4 bottom-4 bg-stone-800 border border-stone-600 rounded p-2 text-center shadow-lg hidden sm:block pointer-events-auto">
                   <div className="text-[10px] font-sans text-stone-400 uppercase tracking-widest">Life</div>
                   <div className="text-2xl font-bold text-white leading-none">40</div>
                </div>

                <div className="relative flex justify-center w-full max-w-4xl mx-auto perspective-[1200px] pointer-events-auto">
                  {handIds.map((cardId, index) => {
                    const card = CARDS.find(c => c.id === cardId);
                    return (
                      <HandCard 
                        key={`hand-${card.id}`}
                        card={card}
                        index={index}
                        total={handIds.length}
                        isDragging={dragging?.id === card.id}
                        onPointerDown={handlePointerDown}
                        onMouseEnter={() => setHoveredCardId(card.id)}
                        onMouseLeave={() => setHoveredCardId(null)}
                      />
                    );
                  })}
                </div>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
